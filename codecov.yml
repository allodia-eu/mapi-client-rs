# The coverage floor, defined once.
#
# CI reads `coverage.status.project.default.target` out of this file and passes
# it to `cargo llvm-cov --fail-under-lines`, and scripts/Invoke-Gate.ps1 reads
# the same key. There is no second copy of the number to drift.
#
# 95% is achievable rather than aspirational specifically because mapi-proto is
# sans-io: fixtures replay straight through it with no network to stub.

coverage:
  precision: 2
  round: down
  range: "90...100"
  status:
    project:
      default:
        target: 95%
        threshold: 0.5%
    patch:
      default:
        target: 95%
        threshold: 0%

# Excluded from the metric, for the same reason a test harness excludes itself:
#   - mapi-cli is diagnostic tooling, exercised by use rather than by unit test
#   - live tests need the Exchange lab, which CI does not have
ignore:
  - "crates/mapi-cli/**"
  - "**/tests/live/**"

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
