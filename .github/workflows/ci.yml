# CI for mapi-client-rs.
#
# There is deliberately no live job. CI never sees the Exchange server, so a green badge here
# means "the committed fixtures still decode and every gate passes" — never "verified against
# Exchange". Live verification is scripts/Test-Live.ps1, run deliberately, on a machine that has
# the lab. The README says the same thing, so nobody has to infer it.
#
# scripts/Invoke-Gate.ps1 mirrors this file step for step. If you change one, change the other.
# Steps are named after the gate's, so a red step here is the `-Only` name to rerun locally.
#
# Checks are grouped into jobs by what they need rather than one job per check. A runner spends
# about 25 seconds booting, installing the toolchain and restoring the cache before it does
# anything, and most checks here take less time than that once the cache is warm; fifteen jobs
# were mostly setup. `features` is the critical path at over three minutes, so every other job
# can absorb several checks without the run getting any longer. Inside a job, each check after
# the first runs `if: !cancelled()`, so one failure does not hide the others — the property that
# separate jobs had and that the gate keeps locally.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml calls this rather than restating the gate. There is one definition of "green",
  # and a release runs it against the tagged commit like any other push.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Keeps the runner's target/ small for the cache, for the same reason
  # [profile.dev] debug = "line-tables-only" exists in Cargo.toml.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  # ---------------------------------------------------------------------------
  # Everything that needs no compiler: the version claims, formatting, spelling and
  # the licence allowlist.
  # ---------------------------------------------------------------------------
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml is the single source of truth for the compiler, and rustup reads it
      # directly in every job that builds. What is checked here is the two places that restate it.
      - name: toolchain
        run: |
          set -euo pipefail

          channel=$(grep -oP 'channel\s*=\s*"\K[^"]+' rust-toolchain.toml)

          # An MSRV claim that disagrees with the pinned toolchain is a claim that is wrong.
          declared=$(grep -oP '^rust-version\s*=\s*"\K[^"]+' Cargo.toml)
          case "$channel" in
            "$declared"*) ;;
            *) echo "::error::rust-toolchain.toml pins $channel but Cargo.toml declares rust-version $declared"; exit 1 ;;
          esac

          # The README's MSRV badge is a third copy of the same number, and the only one a reader
          # sees before deciding whether this crate builds for them. A stale badge is a wrong
          # public claim. Mirrors Invoke-Gate.ps1.
          badge=$(grep -oP 'img\.shields\.io/badge/MSRV-\K[0-9.]+' README.md || true)
          if [ -z "$badge" ]; then
            echo "::error::No MSRV badge found in README.md"; exit 1
          fi
          if [ "$badge" != "$channel" ]; then
            echo "::error::README MSRV badge says $badge but rust-toolchain.toml pins $channel"; exit 1
          fi

          echo "toolchain $channel | MSRV $declared | badge $badge" >> "$GITHUB_STEP_SUMMARY"

      # Nightly, because rustfmt.toml uses nightly-only options (error_on_line_overflow,
      # wrap_comments, imports_granularity). The compiler itself stays on stable.
      - uses: dtolnay/rust-toolchain@nightly
        if: ${{ !cancelled() }}
        with:
          components: rustfmt
      - name: fmt
        if: ${{ !cancelled() }}
        run: cargo +nightly fmt --all -- --check

      - name: typos
        if: ${{ !cancelled() }}
        uses: crate-ci/typos@v1

      # The mechanism behind "permissive dependencies only": a copyleft transitive dependency
      # fails the build rather than being noticed at publish time.
      - name: deny
        if: ${{ !cancelled() }}
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  # ---------------------------------------------------------------------------
  # Every --all-features check on Linux, in one job so they share one cache and one
  # build: clippy, build, doc, test and coverage.
  # ---------------------------------------------------------------------------
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No version here: with no argument, rustup installs what rust-toolchain.toml names,
      # components and profile included.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest,cargo-llvm-cov

      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: build
        if: ${{ !cancelled() }}
        run: cargo build --workspace --all-features

      - name: doc
        if: ${{ !cancelled() }}
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps

      # --no-tests=warn because the workspace is still being populated and nextest treats an empty
      # suite as an error. Not a hole in the gate: a suite that silently emptied out would fail
      # the 95% coverage floor long before it would fail here.
      - name: test
        if: ${{ !cancelled() }}
        run: cargo nextest run --workspace --all-features --no-tests=warn
      # nextest does not run doctests, and the doctests on the main entry points are part of the
      # public API contract. Run them rather than lose them.
      - name: test (doc)
        if: ${{ !cancelled() }}
        run: cargo test --workspace --all-features --doc

      - name: coverage
        id: coverage
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail

          # The coverage floor is defined once, in codecov.yml. Read it, do not repeat it.
          floor=$(grep -A3 '^\s*project:' codecov.yml | grep -oP 'target:\s*\K\d+' | head -1)
          echo "coverage floor ${floor}%" >> "$GITHUB_STEP_SUMMARY"

          cargo llvm-cov --workspace --all-features \
            --ignore-filename-regex 'crates.mapi-cli.src' \
            --lcov --output-path lcov.info

          # An empty workspace measures zero lines, which llvm-cov reports as "-" rather than a
          # percentage, so --fail-under-lines would fail a codebase with nothing wrong with it.
          # Enforce the floor only when there is something to measure. This never weakens once
          # code exists, which is the property that matters. Mirrors Invoke-Gate.ps1.
          total_lines=$(cargo llvm-cov report --summary-only \
            --ignore-filename-regex 'crates.mapi-cli.src' \
            | awk '/^TOTAL/ { print $8 }')

          if [ -z "${total_lines:-}" ] || [ "$total_lines" -eq 0 ]; then
            echo "::warning::No instrumented lines yet - the ${floor}% floor is not enforceable until code lands."
            exit 0
          fi

          cargo llvm-cov report --ignore-filename-regex 'crates.mapi-cli.src' --fail-under-lines "$floor"

      - name: Upload to Codecov
        if: ${{ !cancelled() && steps.coverage.outcome == 'success' }}
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          # The floor is already enforced above, by the step that owns the number. This upload is
          # for the trend graph and the PR comment, so a Codecov outage must not fail the build.
          fail_ci_if_error: false

  # ---------------------------------------------------------------------------
  # `check` builds --all-features, the one combination no consumer who turns a
  # feature off ever gets. The powerset is read from each crate's own [features]
  # table, so a feature added later is covered without editing this. Its own job
  # because it is the slowest thing here, and everything else runs beside it.
  # ---------------------------------------------------------------------------
  features:
    name: features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-hack
      - run: cargo hack clippy --workspace --feature-powerset --skip default --all-targets -- -D warnings
      - if: ${{ !cancelled() }}
        run: cargo hack test --workspace --feature-powerset --skip default
      # A doc link to an item behind a feature is broken in every combination without it; the
      # doc step sees only --all-features. Mirrors scripts/Invoke-Gate.ps1.
      - if: ${{ !cancelled() }}
        run: cargo hack doc --workspace --feature-powerset --skip default --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # ---------------------------------------------------------------------------
  # The tests again on Windows, because this crate's whole point is that it does
  # not require Windows — an accidental platform dependency must fail here, not for
  # a user. And the two checks that are PowerShell 5.1 scripts, which is
  # Windows-only by definition (see scripts/_Boot.ps1 for why 5.1): one
  # implementation, exercised the same way locally and in CI.
  # ---------------------------------------------------------------------------
  windows:
    name: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: test
        run: cargo nextest run --workspace --all-features --no-tests=warn
      - name: test (doc)
        if: ${{ !cancelled() }}
        run: cargo test --workspace --all-features --doc

      - name: file-length
        if: ${{ !cancelled() }}
        shell: powershell
        run: .\scripts\Check-FileLength.ps1

      # The fixtures are byte-exact captures from a real mailbox, which makes an accidental
      # disclosure a live risk rather than a theoretical one. mapi-cli refuses to write a file that
      # still carries a needle and Capture-Fixtures.ps1 checks again afterwards — but both of those
      # run on the machine that has the lab. This is the check that runs on every pull request,
      # from anyone, with no lab at all: it looks for non-placeholder GUIDs, long hexadecimal runs
      # and URL hosts this repository did not choose.
      - name: no-secrets
        if: ${{ !cancelled() }}
        shell: powershell
        run: .\scripts\Assert-NoSecrets.ps1

  # ---------------------------------------------------------------------------
  # Posts the public API diff on every PR, so an accidental breaking change is
  # visible in review rather than after publish. Advisory, so it is not one of
  # ci-ok's needs — and that is why it stays a job of its own rather than a step
  # in `lint`, where a failure to install the tool would fail the gate.
  # ---------------------------------------------------------------------------
  public-api:
    name: public-api
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      # The tool is an input, not a tag. install-action publishes per-tool tags like `@nextest`,
      # but they carry no version, so there is nothing to keep up to date and nothing to review
      # when they move; every use here pins `@v2` and names the tool instead. It is also the only
      # form that works for every tool — there is no `@cargo-public-api` tag, and an unresolvable
      # action fails the job before any step runs, which is what happened the first time this job
      # ever executed.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-public-api

      - name: Diff public API against the base branch
        run: |
          set -euo pipefail
          base="origin/${{ github.event.pull_request.base.ref }}"
          git fetch origin "${{ github.event.pull_request.base.ref }}" --depth=1

          {
            echo "## Public API diff"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          for pkg in mapi-proto negotiate-auth mapi-autodiscover mapi-client; do
            echo "### \`$pkg\`" >> "$GITHUB_STEP_SUMMARY"
            echo '```diff' >> "$GITHUB_STEP_SUMMARY"
            # Two things that both fail quietly if you get them wrong:
            #   `base..head` — a bare revision is parsed as a published crate version instead;
            #   `+nightly`   — rust-toolchain.toml selects stable here, and rustdoc JSON is
            #                  nightly-only. Mirrors scripts/Invoke-Gate.ps1.
            if ! cargo +nightly public-api --package "$pkg" diff "$base..HEAD" \
              >> "$GITHUB_STEP_SUMMARY" 2>&1
            then
              echo "(diff unavailable for $pkg)" >> "$GITHUB_STEP_SUMMARY"
              # Annotated rather than swallowed: a job that reports nothing must not look the
              # same as a job that reports no changes.
              echo "::warning::public-api diff failed for $pkg"
            fi
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done

  # ---------------------------------------------------------------------------
  # One required check to point branch protection at, so adding a job later does
  # not silently leave it unenforced.
  # ---------------------------------------------------------------------------
  ci-ok:
    name: ci-ok
    if: always()
    needs: [lint, check, features, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any needed job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All gates passed."
