[files]
extend-exclude = [
    "spec/",
    "fixtures/",
    "LICENSE-APACHE",
    "LICENSE-MIT",
]

[default]
# Git SHAs and hex constants are not words. Without this, `4d458ba` is reported as a misspelling
# of "by", which is the kind of false positive that teaches people to ignore the tool.
extend-ignore-identifiers-re = [
    "\\b[0-9a-f]{7,40}\\b",
]
# The last token IIS sends to complete a Negotiate handshake, in base64: `A1 07 30 05 A0 03 0A 01
# 00`, a NegTokenResp that is accept-completed and nothing else. Quoted where it is measured and
# where it is replayed; the `Ba` inside it reads as a misspelling of "by".
extend-ignore-re = [
    "oQcwBaADCgEA",
]

[default.extend-words]
# MAPI/Exchange vocabulary that reads as a typo to a spell checker.
DN = "DN"          # distinguished name, as in LegacyDN
dn = "dn"
ROP = "ROP"        # remote operation
rop = "rop"
nd = "nd"

# Not a word but a fragment. scripts\Initialize-ExchangeLab.ps1 seeds accented subjects as
# `caf$([char]0xE9)` rather than as literals, because a BOM-less read would send the literal as
# mojibake and a sent message cannot be recalled. That leaves `caf` on its own, which the checker
# offers to correct to "calf".
caf = "caf"
